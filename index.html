<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b0e13">
  <meta name="description" content="Apex Legends ランクマップのローテーションを日本時間で表示">
  <title>Apex Legends ランクマップ</title>

  
  <style>
    :root{color-scheme:dark;--bg:#07090d;--panel:rgba(18,23,32,.78);--line:rgba(255,255,255,.10);--text:#f6f8fb;--muted:#a7b0bd;--accent:#7ee7ff;--accent2:#9c7cff;--radius:18px;--shadow:0 24px 70px rgba(0,0,0,.38)}
    *{box-sizing:border-box}html{scroll-behavior:smooth}
    body{margin:0;min-height:100vh;color:var(--text);background:radial-gradient(circle at 15% -10%,rgba(126,231,255,.12),transparent 30%),radial-gradient(circle at 90% 5%,rgba(156,124,255,.10),transparent 28%),linear-gradient(180deg,#090c12,#06080c);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.20;background-image:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);background-size:32px 32px;mask-image:linear-gradient(to bottom,black,transparent 75%)}
    button{font:inherit}.app{width:min(1180px,100%);margin:auto;padding:28px 16px 56px}
    .topbar{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-bottom:18px}
    .eyebrow{margin:0 0 5px;color:var(--accent);font-size:10px;font-weight:900;letter-spacing:.22em;text-transform:uppercase}
    h1{margin:0;font-size:clamp(24px,5vw,38px);line-height:1;letter-spacing:-.045em}.topbarSub{margin:8px 0 0;color:var(--muted);font-size:12px}
    .refreshButton{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 15px;border:1px solid rgba(255,255,255,.18);border-radius:12px;background:rgba(255,255,255,.045);color:var(--text);font-size:13px;font-weight:850;cursor:pointer;backdrop-filter:blur(12px);transition:.2s}
    .refreshButton:hover{transform:translateY(-1px);border-color:rgba(126,231,255,.45);background:rgba(126,231,255,.08)}.refreshIcon{font-size:17px}
    .hero{position:relative;overflow:hidden;min-height:390px;padding:30px;display:flex;flex-direction:column;justify-content:flex-end;border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);background:linear-gradient(180deg,rgba(5,7,10,.06),rgba(5,7,10,.32) 30%,rgba(5,7,10,.94)),linear-gradient(90deg,rgba(126,231,255,.10),transparent 48%,rgba(156,124,255,.08));isolation:isolate}
    .hero:before{content:"";position:absolute;inset:0;z-index:-2;background-image:var(--hero-image);background-size:cover;background-position:center;transform:scale(1.03);filter:saturate(.95) contrast(1.04)}
    .hero:after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(90deg,rgba(0,0,0,.58),transparent 62%),linear-gradient(0deg,rgba(0,0,0,.82),transparent 65%)}
    .heroTop{position:absolute;top:22px;left:22px;right:22px;display:flex;justify-content:space-between;gap:10px}
    .livePill,.modePill{display:inline-flex;align-items:center;gap:7px;min-height:30px;padding:0 10px;border:1px solid rgba(255,255,255,.15);border-radius:999px;background:rgba(7,10,14,.50);backdrop-filter:blur(12px);color:#eaf0f6;font-size:10px;font-weight:850;letter-spacing:.08em;text-transform:uppercase}
    .liveDot{width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 13px var(--accent)}
    .heroContent{display:grid;grid-template-columns:1fr auto;align-items:end;gap:30px;position:relative;z-index:2}
    .currentLabel{margin:0 0 6px;color:#d9f8ff;font-size:11px;font-weight:900;letter-spacing:.16em;text-transform:uppercase}
    .currentMap{margin:0;max-width:760px;font-size:clamp(44px,8vw,82px);line-height:.9;letter-spacing:-.065em;text-shadow:0 10px 35px rgba(0,0,0,.45)}
    .currentTime{margin:13px 0 0;color:rgba(245,248,251,.72);font-size:12px;font-variant-numeric:tabular-nums}
    .countdownBox{min-width:265px;padding:18px 20px;border:1px solid rgba(255,255,255,.15);border-radius:15px;background:rgba(7,10,14,.58);backdrop-filter:blur(15px);box-shadow:0 15px 40px rgba(0,0,0,.24)}
    .countdownLabel{display:block;margin-bottom:7px;color:var(--muted);font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
    .countdown{display:block;font-size:clamp(34px,5vw,55px);line-height:1;font-weight:850;letter-spacing:-.055em;font-variant-numeric:tabular-nums}.countdownSub{display:block;margin-top:7px;color:rgba(255,255,255,.45);font-size:10px}
    .nextPanel{position:relative;overflow:hidden;display:grid;grid-template-columns:1fr auto;align-items:center;gap:20px;margin-top:12px;padding:18px 20px;border:1px solid var(--line);border-radius:15px;background:var(--panel);backdrop-filter:blur(14px)}
    .nextPanel:after{content:"";position:absolute;right:-40px;top:-60px;width:180px;height:180px;border-radius:50%;background:rgba(126,231,255,.08);filter:blur(5px)}
    .nextLabel{margin:0 0 4px;color:var(--muted);font-size:10px;font-weight:850;letter-spacing:.12em;text-transform:uppercase}.nextMap{margin:0;font-size:clamp(24px,5vw,34px);line-height:1.05;letter-spacing:-.045em}.nextTime{margin:0;color:var(--muted);font-size:11px;text-align:right;font-variant-numeric:tabular-nums}
    .statusLine{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:13px 2px 28px;color:rgba(167,176,189,.65);font-size:10px}.statusFixed{display:inline-flex;align-items:center;gap:6px;padding:5px 9px;border:1px solid var(--line);border-radius:999px;background:rgba(255,255,255,.025)}
    .sectionHeader{display:flex;align-items:end;justify-content:space-between;gap:12px;margin-bottom:11px}.sectionHeader h3{margin:0;font-size:18px;letter-spacing:-.025em}.sectionHeader p{margin:0;color:rgba(167,176,189,.62);font-size:10px}
    .schedule{display:grid;gap:7px}.scheduleItem{position:relative;display:grid;grid-template-columns:6px 1fr auto;align-items:center;gap:13px;min-height:68px;padding:10px 13px;overflow:hidden;border:1px solid var(--line);border-radius:13px;background:rgba(18,23,32,.72);backdrop-filter:blur(10px);transition:.2s}
    .scheduleItem:hover{transform:translateX(2px);border-color:rgba(255,255,255,.18);background:rgba(25,31,42,.86)}.scheduleIndicator{width:5px;height:40px;border-radius:99px;background:rgba(255,255,255,.14)}
    .scheduleItem.now{border-color:rgba(126,231,255,.42);background:linear-gradient(90deg,rgba(126,231,255,.12),rgba(18,23,32,.82) 48%),rgba(18,23,32,.82);box-shadow:inset 3px 0 0 var(--accent),0 10px 30px rgba(0,0,0,.14)}
    .scheduleItem.now .scheduleIndicator{background:var(--accent);box-shadow:0 0 12px rgba(126,231,255,.55)}
    .mapName{margin:0;font-size:15px;font-weight:850;line-height:1.2;letter-spacing:-.02em}.time{margin:4px 0 0;color:var(--muted);font-size:11px;font-variant-numeric:tabular-nums}
    .badge{min-width:65px;padding:6px 9px;border:1px solid var(--line);border-radius:999px;background:rgba(255,255,255,.04);color:var(--muted);font-size:9px;font-weight:800;text-align:center;white-space:nowrap}.scheduleItem.now .badge{border-color:transparent;background:var(--accent);color:#061015}
    .footerNote{margin:22px 0 0;color:rgba(167,176,189,.45);font-size:9px;line-height:1.6;text-align:center}
    @media(min-width:760px){.app{padding-top:38px}.hero{min-height:440px;padding:34px}.heroTop{top:26px;left:26px;right:26px}.schedule{grid-template-columns:1fr 1fr}}
    @media(max-width:620px){.app{padding:18px 10px 40px}.topbar{align-items:flex-start}.topbarSub{display:none}.refreshButton{min-height:40px;padding:0 12px}.hero{min-height:410px;padding:20px}.heroTop{top:16px;left:16px;right:16px}.heroContent{grid-template-columns:1fr;gap:18px}.countdownBox{min-width:0;padding:14px 16px}.countdown{font-size:42px}.nextPanel{grid-template-columns:1fr}.nextTime{text-align:left}.scheduleItem{grid-template-columns:5px 1fr}.badge{display:none}}
  </style>

</head>


<body>
  <main class="app">
    <header class="topbar">
      <div>
        <p class="eyebrow">Battle Royale · Ranked</p>
        <h1>Apex ランクマップ</h1>
        <p class="topbarSub">Current split rotation · Japan Standard Time</p>
      </div>
      <button id="refreshButton" class="refreshButton" type="button" aria-label="マップ情報を更新">
        <span class="refreshIcon">↻</span>更新
      </button>
    </header>

    <section class="hero" id="hero" aria-label="現在のランクマップ">
      <div class="heroTop">
        <span class="livePill"><span class="liveDot"></span> LIVE ROTATION</span>
        <span class="modePill">RANKED · JST</span>
      </div>
      <div class="heroContent">
        <div class="heroText">
          <p class="currentLabel">現在のマップ</p>
          <h2 id="currentMap" class="currentMap">読み込み中</h2>
          <p id="currentTime" class="currentTime">--</p>
        </div>
        <div class="countdownBox">
          <span class="countdownLabel">次のマップまで</span>
          <strong id="countdown" class="countdown" aria-live="polite">--:--:--</strong>
          <span class="countdownSub">日本時間 · リアルタイム</span>
        </div>
      </div>
    </section>

    <section class="nextPanel" aria-label="次のランクマップ">
      <div>
        <p class="nextLabel">Next Map</p>
        <h3 id="nextMap" class="nextMap">--</h3>
      </div>
      <p id="nextTime" class="nextTime">--</p>
    </section>

    <div class="statusLine">
      <span id="lastUpdated">更新: --</span>
      <span class="statusFixed">● 固定ローテーション</span>
    </div>

    <section aria-label="今後7日間のマップスケジュール">
      <div class="sectionHeader">
        <h3>今後7日間</h3>
        <p>日本時間 · 4時間30分ローテーション</p>
      </div>
      <div id="schedule" class="schedule"></div>
    </section>

    <p class="footerNote">※ 表示時刻は端末の現在時刻を基準に自動更新されます。</p>
  </main>

  <script>
    /*
     * ==========================================
     * Apex Legends ランクマップ設定
     * ==========================================
     */

    const TZ = "Asia/Tokyo";

    // 1マップあたりの表示時間
    const DURATION_MINUTES = 270;

    // マップローテーション
    const MAPS = [
      {
        name: "World's Edge"
      },
      {
        name: "Olympus"
      },
      {
        name: "Broken Moon"
      }
    ];

    /*
     * ローテーションの基準時刻
     *
     * 2026-09-20 00:30 JST
     * = 2026-09-19 15:30 UTC
     *
     * 画像で確認できる新スプリットのローテーション開始時刻
     */
    const ANCHOR = new Date(
      "2026-09-19T15:30:00.000Z"
    );


    /*
     * ==========================================
     * DOM
     * ==========================================
     */

    const $ = (id) =>
      document.getElementById(id);


    /*
     * ==========================================
     * 日付フォーマット
     * ==========================================
     */

    const dateFmt =
      new Intl.DateTimeFormat("ja-JP", {
        timeZone: TZ,

        month: "numeric",
        day: "numeric",
        weekday: "short",

        hour: "2-digit",
        minute: "2-digit"
      });


    const shortDateFmt =
      new Intl.DateTimeFormat("ja-JP", {
        timeZone: TZ,

        month: "numeric",
        day: "numeric",
        weekday: "short"
      });


    /*
     * ==========================================
     * 時刻表示
     * ==========================================
     */

    function formatRange(item) {
      return (
        `${dateFmt.format(item.start)}`
        + " ～ "
        + `${dateFmt.format(item.end)}`
      );
    }


    /*
     * ==========================================
     * カウントダウン
     * ==========================================
     */

    function formatClock(ms) {

      const total =
        Math.max(
          0,
          Math.floor(ms / 1000)
        );

      const hours =
        Math.floor(total / 3600);

      const minutes =
        Math.floor(
          (total % 3600) / 60
        );

      const seconds =
        total % 60;

      return [
        hours,
        minutes,
        seconds
      ]
        .map(
          (n) =>
            String(n).padStart(2, "0")
        )
        .join(":");
    }


    /*
     * ==========================================
     * スケジュール生成
     * ==========================================
     */

    function buildSchedule(
      now = new Date()
    ) {

      const blockMs =
        DURATION_MINUTES *
        60 *
        1000;


      const elapsedBlocks =
        Math.floor(
          (
            now.getTime() -
            ANCHOR.getTime()
          ) / blockMs
        );


      const currentStart =
        new Date(
          ANCHOR.getTime() +
          elapsedBlocks * blockMs
        );


      const currentIndex =
        (
          elapsedBlocks %
          MAPS.length +
          MAPS.length
        ) % MAPS.length;


      const items = [];


      /*
       * 7日間以上を生成してから
       * 必要な範囲だけ表示
       */
      for (
        let i = 0;
        i < 80;
        i += 1
      ) {

        const mapIndex =
          (
            currentIndex +
            i
          ) % MAPS.length;


        const start =
          new Date(
            currentStart.getTime() +
            i * blockMs
          );


        const end =
          new Date(
            start.getTime() +
            blockMs
          );


        items.push({
          name:
            MAPS[mapIndex].name,

          start,
          end,

          isCurrent:
            i === 0
        });
      }


      const sevenDaysLater =
        now.getTime() +
        7 *
        24 *
        60 *
        60 *
        1000;


      return items.filter(
        (item) =>
          item.start.getTime() <
          sevenDaysLater
      );
    }


    /*
     * ==========================================
     * スケジュール表示
     * ==========================================
     */

    function renderSchedule(items) {

      const root =
        $("schedule");


      root.innerHTML = "";


      items.forEach(
        (item) => {

          const row =
            document.createElement(
              "article"
            );


          row.className =
            `scheduleItem${
              item.isCurrent
                ? " now"
                : ""
            }`;


          const indicator =
            document.createElement(
              "span"
            );

          indicator.className =
            "scheduleIndicator";

          indicator.setAttribute(
            "aria-hidden",
            "true"
          );


          const content =
            document.createElement(
              "div"
            );


          const mapName =
            document.createElement(
              "p"
            );

          mapName.className =
            "mapName";

          mapName.textContent =
            item.name;


          const time =
            document.createElement(
              "p"
            );

          time.className =
            "time";

          time.textContent =
            formatRange(item);


          content.appendChild(
            mapName
          );

          content.appendChild(
            time
          );


          const badge =
            document.createElement(
              "span"
            );

          badge.className =
            "badge";

          badge.textContent =
            item.isCurrent
              ? "現在"
              : shortDateFmt.format(
                  item.start
                );


          row.appendChild(
            indicator
          );

          row.appendChild(
            content
          );

          row.appendChild(
            badge
          );


          root.appendChild(
            row
          );
        }
      );
    }


    /*
     * ==========================================
     * 全体描画
     * ==========================================
     */

    function render() {

      const now =
        new Date();


      const items =
        buildSchedule(now);


      const current =
        items[0];


      const next =
        items[1];


      if (!current || !next) {
        return;
      }


      /*
       * 現在のマップ
       */
      $("currentMap")
        .textContent =
        current.name;


      /*
       * 現在の時間帯
       */
      $("currentTime")
        .textContent =
        formatRange(current);


      /*
       * 次のマップ
       */
      $("nextMap")
        .textContent =
        next.name;


      /*
       * 次のマップ開始時間
       */
      $("nextTime")
        .textContent =
        formatRange(next);


      /*
       * カウントダウン
       */
      $("countdown")
        .textContent =
        formatClock(
          current.end.getTime() -
          now.getTime()
        );


      /*
       * 最終更新
       */
      $("lastUpdated")
        .textContent =
        `更新: ${dateFmt.format(now)}`;


      /*
       * スケジュール
       */
      renderSchedule(items);
    }


    /*
     * ==========================================
     * 更新ボタン
     * ==========================================
     */

    $("refreshButton")
      .addEventListener(
        "click",
        render
      );


    /*
     * ==========================================
     * 初期表示
     * ==========================================
     */

    render();


    /*
     * ==========================================
     * 1秒ごとに更新
     * ==========================================
     */

    setInterval(
      render,
      1000
    );
  </script>
