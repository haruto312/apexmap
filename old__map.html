<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0e13">
<meta name="description" content="Apex Legends ランクマップのローテーションを日本時間で表示">
<title>Apex Legends ランクマップ</title>
<style>
:root{color-scheme:dark;--bg:#07090d;--panel:rgba(18,23,32,.78);--line:rgba(255,255,255,.10);--text:#f6f8fb;--muted:#a7b0bd;--accent:#7ee7ff;--radius:18px;--shadow:0 24px 70px rgba(0,0,0,.38)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;min-height:100vh;color:var(--text);background:radial-gradient(circle at 15% -10%,rgba(126,231,255,.12),transparent 30%),radial-gradient(circle at 90% 5%,rgba(156,124,255,.10),transparent 28%),linear-gradient(180deg,#090c12,#06080c);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button{font:inherit}.app{width:min(1180px,100%);margin:auto;padding:28px 16px 56px}.topbar{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-bottom:18px}.eyebrow{margin:0 0 5px;color:var(--accent);font-size:10px;font-weight:900;letter-spacing:.22em;text-transform:uppercase}h1{margin:0;font-size:clamp(24px,5vw,38px);line-height:1;letter-spacing:-.045em}.topbarSub{margin:8px 0 0;color:var(--muted);font-size:12px}.refreshButton{min-height:44px;padding:0 15px;border:1px solid rgba(255,255,255,.18);border-radius:12px;background:rgba(255,255,255,.045);color:var(--text);font-size:13px;font-weight:850;cursor:pointer}.hero{--hero-image:none;position:relative;overflow:hidden;min-height:390px;padding:30px;display:flex;flex-direction:column;justify-content:flex-end;border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);background:#111;isolation:isolate}.hero:before{content:"";position:absolute;inset:0;z-index:-2;background-image:var(--hero-image);background-size:cover;background-position:center;transform:scale(1.025);filter:saturate(1.05) contrast(1.04);transition:background-image .25s ease}.hero:after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(90deg,rgba(0,0,0,.62),rgba(0,0,0,.12) 62%),linear-gradient(0deg,rgba(0,0,0,.86),transparent 68%)}.heroTop{position:absolute;top:22px;left:22px;right:22px;display:flex;justify-content:space-between;gap:10px}.livePill,.modePill{display:inline-flex;align-items:center;gap:7px;min-height:30px;padding:0 10px;border:1px solid rgba(255,255,255,.15);border-radius:999px;background:rgba(7,10,14,.5);backdrop-filter:blur(12px);font-size:10px;font-weight:850;letter-spacing:.08em}.liveDot{width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 13px var(--accent)}.heroContent{display:grid;grid-template-columns:1fr auto;align-items:end;gap:30px}.currentLabel{margin:0 0 6px;color:#d9f8ff;font-size:11px;font-weight:900;letter-spacing:.16em}.currentMap{margin:0;font-size:clamp(44px,8vw,82px);line-height:.9;letter-spacing:-.065em;text-shadow:0 10px 35px #000}.currentTime{margin:13px 0 0;color:rgba(245,248,251,.72);font-size:12px}.countdownBox{min-width:265px;padding:18px 20px;border:1px solid rgba(255,255,255,.15);border-radius:15px;background:rgba(7,10,14,.58);backdrop-filter:blur(15px)}.countdownLabel{display:block;margin-bottom:7px;color:var(--muted);font-size:10px;font-weight:800}.countdown{display:block;font-size:clamp(34px,5vw,55px);line-height:1;font-variant-numeric:tabular-nums}.countdownSub{display:block;margin-top:7px;color:rgba(255,255,255,.45);font-size:10px}.nextPanel{display:grid;grid-template-columns:1fr auto;align-items:center;gap:20px;margin-top:12px;padding:18px 20px;border:1px solid var(--line);border-radius:15px;background:var(--panel)}.nextLabel{margin:0 0 4px;color:var(--muted);font-size:10px}.nextMap{margin:0;font-size:clamp(24px,5vw,34px)}.nextTime{margin:0;color:var(--muted);font-size:11px;text-align:right}.statusLine{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:13px 2px 28px;color:rgba(167,176,189,.65);font-size:10px}.sectionHeader{display:flex;align-items:end;justify-content:space-between;gap:12px;margin-bottom:11px}.sectionHeader h3{margin:0;font-size:18px}.sectionHeader p{margin:0;color:rgba(167,176,189,.62);font-size:10px}.schedule{display:grid;gap:7px}.scheduleItem{display:grid;grid-template-columns:6px 1fr auto;align-items:center;gap:13px;min-height:68px;padding:10px 13px;border:1px solid var(--line);border-radius:13px;background:rgba(18,23,32,.72)}.scheduleIndicator{width:5px;height:40px;border-radius:99px;background:rgba(255,255,255,.14)}.scheduleItem.now{border-color:rgba(126,231,255,.42);background:linear-gradient(90deg,rgba(126,231,255,.12),rgba(18,23,32,.82) 48%)}.scheduleItem.now .scheduleIndicator{background:var(--accent)}.mapName{margin:0;font-size:15px;font-weight:850}.time{margin:4px 0 0;color:var(--muted);font-size:11px}.badge{min-width:65px;padding:6px 9px;border:1px solid var(--line);border-radius:999px;color:var(--muted);font-size:9px;text-align:center}.scheduleItem.now .badge{background:var(--accent);color:#061015}.footerNote{margin:22px 0 0;color:rgba(167,176,189,.45);font-size:9px;text-align:center}
@media(min-width:760px){.hero{min-height:440px;padding:34px}.schedule{grid-template-columns:1fr 1fr}}@media(max-width:620px){.app{padding:18px 10px 40px}.topbarSub{display:none}.hero{min-height:410px;padding:20px}.heroContent{grid-template-columns:1fr;gap:18px}.countdownBox{min-width:0}.nextPanel{grid-template-columns:1fr}.nextTime{text-align:left}.scheduleItem{grid-template-columns:5px 1fr}.badge{display:none}}
</style>
</head>
<body>
<main class="app">
<header class="topbar"><div><p class="eyebrow">Battle Royale · Ranked</p><h1>Apex ランクマップ</h1><p class="topbarSub">Current split rotation · Japan Standard Time</p></div><button id="refreshButton" class="refreshButton" type="button">↻ 更新</button></header>
<section class="hero" id="hero"><div class="heroTop"><span class="livePill"><span class="liveDot"></span> LIVE ROTATION</span><span class="modePill">RANKED · JST</span></div><div class="heroContent"><div><p class="currentLabel">現在のマップ</p><h2 id="currentMap" class="currentMap">読み込み中</h2><p id="currentTime" class="currentTime">--</p></div><div class="countdownBox"><span class="countdownLabel">次のマップまで</span><strong id="countdown" class="countdown">--:--:--</strong><span class="countdownSub">日本時間 · リアルタイム</span></div></div></section>
<section class="nextPanel"><div><p class="nextLabel">Next Map</p><h3 id="nextMap" class="nextMap">--</h3></div><p id="nextTime" class="nextTime">--</p></section>
<div class="statusLine"><span id="lastUpdated">更新: --</span><span>● 固定ローテーション</span></div>
<section><div class="sectionHeader"><h3>今後7日間</h3><p>日本時間 · 4時間30分ローテーション</p></div><div id="schedule" class="schedule"></div></section>
<p class="footerNote">※ マップ背景画像はElectronic Arts公式配信画像を使用しています。表示時刻は端末の現在時刻を基準に自動更新されます。</p>
</main>
<script>
const TZ="Asia/Tokyo",DURATION_MINUTES=270;
const MAPS=[
{name:"World's Edge",image:"https://drop-assets.ea.com/images/1ANGzrckUvxyjMXBgcF33n/038523604527b713e593e09dc125d2c8/Apex_S30-Season_Worlds-Edge-16x9.jpg?im=AspectCrop%3D%2816%2C9%29%2CxPosition%3D0.4973958333333333%2CyPosition%3D0.38796296296296295"},
{name:"Olympus",image:"https://drop-assets.ea.com/images/3M9j96pECUCI1nAL06ouH5/ccc3de072fcc869d6c0686d0dae96b7a/Apex_S27-Season_Olympus-16x9.jpg?im=AspectCrop%3D%2816%2C9%29%2CxPosition%3D1%2CyPosition%3D1"},
{name:"Broken Moon",image:"https://drop-assets.ea.com/images/7A38YY4DSVUVne751E02SP/1018cbc3a7d00d862d14d18677fb7b8a/S21_-_BM_-_Quarantine_Zone_2.png?im=AspectCrop%3D%2816%2C9%29%2CxPosition%3D0.5%2CyPosition%3D0.5"}
];
const ANCHOR=new Date("2026-09-19T15:30:00.000Z"),$=id=>document.getElementById(id);
const dateFmt=new Intl.DateTimeFormat("ja-JP",{timeZone:TZ,month:"numeric",day:"numeric",weekday:"short",hour:"2-digit",minute:"2-digit"});
const shortDateFmt=new Intl.DateTimeFormat("ja-JP",{timeZone:TZ,month:"numeric",day:"numeric",weekday:"short"});
const formatRange=i=>`${dateFmt.format(i.start)} ～ ${dateFmt.format(i.end)}`;
function formatClock(ms){let t=Math.max(0,Math.floor(ms/1000));return [Math.floor(t/3600),Math.floor(t%3600/60),t%60].map(n=>String(n).padStart(2,"0")).join(":")}
function buildSchedule(now=new Date()){const block=DURATION_MINUTES*60000,e=Math.floor((now-ANCHOR)/block),base=new Date(ANCHOR.getTime()+e*block),idx=((e%MAPS.length)+MAPS.length)%MAPS.length,items=[];for(let i=0;i<80;i++){const map=MAPS[(idx+i)%MAPS.length],start=new Date(base.getTime()+i*block);items.push({...map,start,end:new Date(start.getTime()+block),isCurrent:i===0})}const limit=now.getTime()+7*86400000;return items.filter(i=>i.start.getTime()<limit)}
function renderSchedule(items){const root=$("schedule");root.innerHTML="";items.forEach(item=>{const row=document.createElement("article");row.className=`scheduleItem${item.isCurrent?" now":""}`;row.innerHTML=`<span class="scheduleIndicator"></span><div><p class="mapName"></p><p class="time"></p></div><span class="badge"></span>`;row.querySelector(".mapName").textContent=item.name;row.querySelector(".time").textContent=formatRange(item);row.querySelector(".badge").textContent=item.isCurrent?"現在":shortDateFmt.format(item.start);root.appendChild(row)})}
let lastMap="";
function render(){const now=new Date(),items=buildSchedule(now),current=items[0],next=items[1];if(!current||!next)return;$("currentMap").textContent=current.name;$("currentTime").textContent=formatRange(current);$("nextMap").textContent=next.name;$("nextTime").textContent=formatRange(next);$("countdown").textContent=formatClock(current.end-now);$("lastUpdated").textContent=`更新: ${dateFmt.format(now)}`;if(current.name!==lastMap){$("hero").style.setProperty("--hero-image",`url("${current.image}")`);lastMap=current.name;renderSchedule(items)}}
$("refreshButton").addEventListener("click",()=>{lastMap="";render()});render();setInterval(render,1000);
</script>
</body>
</html>
